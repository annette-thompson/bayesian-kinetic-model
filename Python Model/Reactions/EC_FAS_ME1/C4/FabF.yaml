  reactants: {FabF: 1, C3_MalACP: 1}
  products: {C3_FabF_MalACP: 1}
  rate_const_key: kon_F_MalACP
  scaling_group: null
  rate_const_value: 284.9474476
  reversible: true
  rvs_rate_const_key: koff_F_MalACP
  rvs_scaling_group: null
  rvs_rate_const_value: 11397.8979
