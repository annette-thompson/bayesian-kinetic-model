# FabF — β-ketoacyl-ACP synthase II
# Condenses acyl-ACPs with malonyl-ACP and elongates by 2 carbons.
# Initiation activity: can bind malonyl-ACP with acetyl- or malonyl-ACP but not acetyl-CoA; 
# BUT final condensation step to make C4 BKeAcACP is turned off. (Generates acetyl-ACP that 
# FabB can turn into acetyl-CoA for FabH initiation.)
# Inhibited by ACP. kcat values differ between saturated and unsaturated substrates.
# Units: kon: μM⁻¹s⁻¹, koff: s⁻¹, kcat: s⁻¹


enzymes: [FabF]
schema_version: ME1_model
defaults:
  sat_chain_lengths: []
  unsat_chain_lengths: []
reactions:
