# Initiation activity: can also bind malonyl-ACP with acetyl- or malonyl-ACP or acetyl-CoA; 
# BUT final condensation step to make C4 BKeAcACP is turned off. (Generates acetyl-CoA for FabH initiation.)
# Inhibited by ACP. kcat values differ between saturated and unsaturated substrates.
# Units: kon: μM⁻¹s⁻¹, koff: s⁻¹, kcat: s⁻¹


