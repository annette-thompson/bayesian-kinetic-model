    chain_template: true
    saturation_template: true
    reactants: {FabB: 1, "C{chain}_AcACP": 1}
    products: {"C{chain}_FabB_AcACP": 1}
    rate_const_key: kon_B_AcACP
    scaling_group: null
    rate_const_value: 4.3386733944842106
    reversible: true
    rvs_rate_const_key: koff_B_AcACP
    rvs_scaling_group: a2
    rvs_rate_const_value: 164.8695889904

  - rxn_name: C10_cis_FabB_binding_EnAcACP
