# FabB — β-ketoacyl-ACP synthase I
# Condenses acyl-ACPs with malonyl-ACP and elongates by 2 carbons.
# Initiation activity: can also bind malonyl-ACP with acetyl- or malonyl-ACP or acetyl-CoA;
# BUT final condensation step to make C4 BKeAcACP is turned off. (Generates acetyl-CoA for FabH initiation.)
# Inhibited by ACP. kcat values differ between saturated and unsaturated substrates.
# Units: kon: μM⁻¹s⁻¹, koff: s⁻¹, kcat: s⁻¹

enzymes: [FabB]
schema_version: ME1_model

axis_definitions:
  chain:
    type: numeric
    values: [4, 6, 8, 10, 12, 14, 16, 18]
  saturation:
    type: categorical
    values:
      sat:   {token: "sat", restrict: {chain: [4, 6, 8, 10, 12, 14, 16, 18]}}
      unsat: {token: "unsat", restrict: {chain: [12, 14, 16, 18]}}

reactions:
  - rxn_name: "FabB_binding_C{chain}_AcACP_{saturation}"
    axes: [chain, saturation]
    reactants: {FabB: 1, "C{chain}_AcACP_{saturation}": 1}
    products: {"C{chain}_FabB_AcACP_{saturation}": 1}
    rate_const_key: kon_B_AcACP
    scaling_group: null
    rate_const_value: 4.3386733944842106
    reversible: true
    rvs_rate_const_key: koff_B_AcACP
    rvs_scaling_group: a2
    rvs_rate_const_value: 164.8695889904

  - rxn_name: FabB_binding_C10_cis3EnAcACP
    reactants: {FabB: 1, C10_cis3EnAcACP: 1}
    products: {C10_FabB_cis3EnAcACP: 1}
    rate_const_key: kon_B_AcACP
    scaling_group: null
    rate_const_value: 4.3386733944842106
    reversible: true
    rvs_rate_const_key: koff_B_AcACP
    rvs_scaling_group: a2
    rvs_rate_const_value: 164.8695889904

  - rxn_name: "C{chain}_FabB_AcACP_{saturation}_activation_release_ACP"
    axes: [chain, saturation]
    reactants: {"C{chain}_FabB_AcACP_{saturation}": 1}
    products: {"C{chain}_FabB_Act_{saturation}": 1, ACP: 1}
    rate_const_key: kfwd_B_AcACP
    scaling_group: (1/b3)
    rate_const_value: 1411.1030972777992
    reversible: true
    rvs_rate_const_key: krvs_B_AcACP
    rvs_scaling_group: b1
    rvs_rate_const_value: 402.13929190000005

  - rxn_name: C10_FabB_cis3EnAcACP_activation_release_ACP
    reactants: {C10_FabB_cis3EnAcACP: 1}
    products: {C10_FabB_Act_cis3: 1, ACP: 1}
    rate_const_key: kfwd_B_AcACP
    scaling_group: (1/b3)
    rate_const_value: 1411.1030972777992
    reversible: true
    rvs_rate_const_key: krvs_B_AcACP
    rvs_scaling_group: b1
    rvs_rate_const_value: 402.13929190000005

  - rxn_name: "C{chain}_FabB_Act_{saturation}_binding_MalACP"
    axes: [chain, saturation]
    reactants: {"C{chain}_FabB_Act_{saturation}": 1, MalACP: 1}
    products: {"C{chain}_FabB_Act_{saturation}_MalACP": 1}
