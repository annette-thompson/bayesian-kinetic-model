name: Bayesian
channels:
  - conda-forge
dependencies:
  - python=3.12

  # --- sampling / probabilistic stack ---
  - pymc>=6
  - pytensor
  - blackjax
  - numpyro
  - nutpie
  - arviz
  - arviz-base
  - preliz

  # --- ODE solving and JAX ---
  - jax==0.7.2
  - jaxlib
  - diffrax>=0.7.2
  - equinox
  - jaxtyping

  # --- numerics / IO ---
  - netcdf4
  - numpy
  - scipy
  - zarr
  - numba
  - llvmlite
  - libsqlite
  - sqlite

  # --- imported directly by Utilities/ and Calculation Files/ ---
  - sympy
  - seaborn
  - matplotlib
  - pandas
  - pyyaml
  - platformdirs

  # --- notebooks ---
  - ipykernel
  - ipython
